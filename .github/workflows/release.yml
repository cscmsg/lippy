name: release
# Action versions verified against the GitHub API on 2026-08-24:
#   actions/checkout v7.0.1, actions/upload-artifact v7.0.1,
#   softprops/action-gh-release v3.0.2. Pinned to the major.

# Tag a version to cut a release:  git tag v0.7.0 && git push origin v0.7.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarise (needs the Apple secrets)"
        type: boolean
        default: true

permissions:
  contents: write   # required to create the Release

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
      APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
      APPLE_DEVELOPER_ID_NAME: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
      # notarytool uses an App Store Connect API key rather than an Apple ID,
      # so no app-specific password and no 2FA prompt in CI.
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

    steps:
      - uses: actions/checkout@v7

      - name: Import signing certificate
        if: env.APPLE_DEVELOPER_CERT_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_DEVELOPER_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on an interactive keychain prompt that
          # nothing in CI can answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build and sign the app
        run: |
          set -euo pipefail
          if [ -n "${APPLE_DEVELOPER_ID_NAME:-}" ]; then
            export SIGN_IDENTITY="$APPLE_DEVELOPER_ID_NAME"
          fi
          ./scripts/make_app.sh
          # make_app.sh already fails the build if the microphone entitlement is
          # missing; a build without it looks fine and cannot hear anything.
          codesign --verify --deep --strict --verbose=2 .dist/LocalFlow.app

      - name: Build the disk image
        run: ./scripts/make_dmg.sh

      - name: Sign the disk image
        if: env.APPLE_DEVELOPER_CERT_P12 != ''
        run: |
          set -euo pipefail
          DMG="$(ls .dist/LocalFlow-*.dmg)"
          # The image needs its own signature, not just the app inside it.
          # Notarisation succeeds either way, but Gatekeeper's check on the
          # downloaded .dmg reports "no usable signature" without this, which is
          # what a user sees before they ever open it.
          codesign --force --sign "$APPLE_DEVELOPER_ID_NAME" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"

      - name: Notarise and staple
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          DMG="$(ls .dist/LocalFlow-*.dmg)"

          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          # Staple the ticket into the image so first launch works offline.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # Gatekeeper's own verdict on the image a user downloads. This is
          # the check that failed the first signed run: it needs the image
          # signed, which the step above now does.
          spctl -a -vvv -t open --context context:primary-signature "$DMG"

          # And the verdict on the app itself, which is what actually launches.
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$MNT"
          spctl -a -vv "$MNT/LocalFlow.app"
          codesign --verify --deep --strict --verbose=2 "$MNT/LocalFlow.app"
          hdiutil detach "$MNT" -quiet

      - name: Checksums
        run: |
          cd .dist
          shasum -a 256 LocalFlow-*.dmg | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: LocalFlow-dmg
          # .dist is a dot-directory and upload-artifact excludes hidden paths
          # by default, which silently uploads nothing and annotates the run as
          # if the build had produced no files.
          include-hidden-files: true
          path: |
            .dist/LocalFlow-*.dmg
            .dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            .dist/LocalFlow-*.dmg
            .dist/SHA256SUMS.txt
          generate_release_notes: true
